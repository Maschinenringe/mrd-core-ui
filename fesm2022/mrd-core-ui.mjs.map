<div class="mrd-chip-container"
  [ngStyle]="{ 'cursor': disabled || !clickable ? 'default' : 'pointer' }"
  [style.--chip-color]="color"
  [style.--chip-background-color]="backgroundColor"
  >
  <div class="mrd-chip-content" [ngStyle]="{'pointer-events': disabled ? 'none' : 'auto'}">
    <mrd-icon *ngIf="prefixIcon" [svgIcon]="prefixIcon"></mrd-icon>
    <div #chipText class="mrd-chip-text" [mrdToolTip]="chipTextValue" showIfTruncated>
      <ng-content></ng-content>
    </div>
    <mrd-icon *ngIf="suffixIcon" [svgIcon]="suffixIcon"></mrd-icon>
  </div>

  <mrd-button icon-button fullIcon diameter="1em" (click)="closeClicked($event)" [disabled]="disabled" *ngIf="closeable">
    <!-- <mrd-icon svgIcon="mrd_close_grey"></mrd-icon> -->
     <span mrd-icon [style.--chip-close-icon-color]="closeIconColor" [style.--chip-close-icon-cross-color]="closeIconCrossColor" class="chip-close-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 36 36" fit="" preserveAspectRatio="xMidYMid meet" focusable="false">
        <g transform="translate(0 0.001)">
          <g id="X-gross-hellgrau" transform="translate(0 -0.001)">
            <path class="kreis" d="M195.722,2783.271a18,18,0,1,1-25.456,0A18,18,0,0,1,195.722,2783.271Z" transform="translate(-164.994 -2778)"></path>
            <path class="x" d="M-184.391-11.15l-2.953-2.953L-190.3-11.15a1.581,1.581,0,0,1-1.12.464,1.581,1.581,0,0,1-1.12-.464,1.585,1.585,0,0,1,0-2.241l2.953-2.953-2.953-2.953a1.584,1.584,0,0,1,0-2.24,1.584,1.584,0,0,1,2.24,0l2.953,2.953,2.953-2.953a1.584,1.584,0,0,1,2.24,0,1.584,1.584,0,0,1,0,2.24l-2.953,2.953,2.953,2.953a1.585,1.585,0,0,1,0,2.241,1.579,1.579,0,0,1-1.12.464A1.579,1.579,0,0,1-184.391-11.15Z" transform="translate(205.343 34.343)"></path>
          </g>
        </g>
      </svg>
     </span>
  </mrd-button>
</div>
