<div #selectContainer class="mrd-select-container" [ngClass]="{'mrd-select-disabled': formControl?.disabled || formArrayControl?.disabled || disabled}">
  <ng-container *ngIf="autoComplete">
    <input
    (click)="triggerClicked()"
    [value]="showValue"
    (input)="autoCompleteInput($event)"
    (keydown)="onKeyDown($event)"
  >
  </ng-container>

  <ng-container *ngIf="!autoComplete">
    <ng-container *ngIf="customTrigger">
      <ng-content select="mrd-select-custom-trigger"></ng-content>
    </ng-container>
    <ng-container *ngIf="!customTrigger">
      <ng-container *ngIf="!chipSelection">
        <div class="mrd-select-trigger" (click)="triggerClicked()">
          <span [mrdToolTip]="showValue" showIfTruncated>{{showValue}}</span>
          <svg fill="currentColor" width="14px" height="14px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" stroke="#CCCCCC" stroke-width="0.048"></g>
            <g id="SVGRepo_iconCarrier"><path d="M11.178 19.569a.998.998 0 0 0 1.644 0l9-13A.999.999 0 0 0 21 5H3a1.002 1.002 0 0 0-.822 1.569l9 13z"></path></g>
          </svg>
        </div>
      </ng-container>
      <ng-container *ngIf="chipSelection">
        <div class="mrd-chip-container">
          <div class="mrd-chip-values" *ngIf="chipSelection">
            <ng-container *ngIf="selectedOptions && selectedOptions.length > 0">
              <mrd-chip *ngFor="let option of selectedOptions"
                (close)="chipClosed(option)"
                [prefixIcon]="chipPrefixIcon"
                [suffixIcon]="chipSuffixIcon"
                [disabled]="formControl?.disabled || formArrayControl?.disabled || disabled"
                >{{option.optionLabel}}</mrd-chip>
            </ng-container>
            <div class="mrd-select-trigger-chip" (click)="triggerClicked()">
              <svg fill="currentColor" width="14px" height="14px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" stroke="#CCCCCC" stroke-width="0.048"></g>
                <g id="SVGRepo_iconCarrier"><path d="M11.178 19.569a.998.998 0 0 0 1.644 0l9-13A.999.999 0 0 0 21 5H3a1.002 1.002 0 0 0-.822 1.569l9 13z"></path></g>
              </svg>
            </div>
          </div>
        </div>
      </ng-container>
    </ng-container>
  </ng-container>
</div>

<ng-template
  cdk-connected-overlay
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  cdkConnectedOverlayPanelClass="mrd-select-options-overlay"
  [cdkConnectedOverlayOrigin]="selectContainer"
  [cdkConnectedOverlayOpen]="showOptions.value"
  [cdkConnectedOverlayPositions]="_positions"
  [cdkConnectedOverlayMinWidth]="optionsMinWidth"
  (backdropClick)="showOptions.value = false"
>
  <div class="mrd-select-options-container">
    <mrd-select-option *ngIf="searchSelection" class="mrd-select-search-option" noCheckbox>
      <input
        placeholder="Suche"
        [value]="searchText"
        (input)="searchInput($event)"
        (click)="$event.stopPropagation()"
        (keydown)="onKeyDown($event)"
        #searchSelectionInput
      >
      <ng-content select="[addButton]"></ng-content>
    </mrd-select-option>
    <div class="mrd-select-options-scroll">
      <mrd-select-option *ngIf="nullable" noCheckbox [value]="null" (optionClicked)="removeSelected()">{{multiple ? 'Auswahl löschen' : '-'}}</mrd-select-option>
      <mrd-select-option *ngIf="searchSelection && searchText.length > 0 && showNoOptionsOnSearch" noCheckbox>Keine Einträge gefunden</mrd-select-option>
      <ng-content select="mrd-select-option"></ng-content>
    </div>
  </div>
</ng-template>
