<div
  [style.--bg-color]="bgColor"
  [style.--knob-color]="knobColor"
  [style.--bg-neutral-color]="bgNeutralColor"
  [style.--knob-neutral-color]="knobNeutralColor"
  [style.--bg-disabled-color]="bgDisabledColor"
  [style.--knob-disabled-color]="knobDisabledColor"
  [style.--width]="width"
  [style.--height]="height"
  class="mrd-toggle-switch-container">
  <div class="mrd-toggle-switch-background" (click)="toggle($event)"
        [ngClass]="{'mrd-toggle-switch-disabled': disabled,
                'mrd-toggle-switch-state-left': state === MrdToggleSwitchState.LEFT, 
                'mrd-toggle-switch-state-neutral': state === MrdToggleSwitchState.NEUTRAL,
                'mrd-toggle-switch-state-right': state === MrdToggleSwitchState.RIGHT}">
        <div class="mrd-toggle-switch-knob"></div>
        <div class="mrd-toggle-swtich-neutral-clickareas" *ngIf="!disabled && state === MrdToggleSwitchState.NEUTRAL">
            <div class="mrd-toggle-switch-neutral-clickarea" (click)="toggle($event,MrdToggleSwitchState.LEFT)"></div>
            <div class="mrd-toggle-switch-neutral-clickarea" (click)="toggle($event,MrdToggleSwitchState.RIGHT)"></div>
        </div>
    </div>
</div>
