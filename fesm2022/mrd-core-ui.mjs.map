<input #baseInput
  (click)="inputClicked($event)"
  (focus)="focus($event)"
  (blur)="blur($event)"
  [value]="value"
  (input)="input($event)"
  [disabled]="formControl?.disabled || disabled"
  [placeholder]="!labelPresent || isFocused ? placeholder : ''"
  [style.pointer-events]="readonly ? 'none' : 'auto'"
  [style.text-align]="textEnd ? 'end' : centered ? 'center' : 'start'"
  [style.color]="formControl?.disabled || disabled ? disabledColor : color"
  [decimalNumber]="maxDigits || maxDigits === 0" [nachkommastellen]="maxDigits"
  [timeInput]="time"
  *ngIf="!textarea"
  >

<textarea #textArea
  (click)="inputClicked($event)"
  (focus)="focus($event)"
  (blur)="blur($event)"
  [value]="value"
  (input)="input($event)"
  [disabled]="formControl?.disabled || disabled"
  [placeholder]="!labelPresent || isFocused ? placeholder : ''"
  [style.pointer-events]="readonly ? 'none' : 'auto'"
  [style.color]="formControl?.disabled || disabled ? disabledColor : color"
  *ngIf="textarea"
  rows="1"
  [ngStyle]="{'line-height': lineHeight + 'px'}"
></textarea>


<div #dateInput *ngIf="date"></div>
<div *ngIf="date && !customDateTimeToggle && !rangeStart && !rangeEnd" >
  <mrd-button icon-button fullIcon diameter="24" iconSize="16" (click)="toggleClicked()" [disabled]="formControl?.disabled || disabled">
    <svg mrd-icon xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 14.986 17.127" fit="" preserveAspectRatio="xMidYMid meet" focusable="false">
      <defs><style>.a{fill:#494949;}</style></defs>
      <path class="a" d="M14.585,5.352H.4a.4.4,0,0,1-.4-.4v-1.2A1.606,1.606,0,0,1,1.606,2.141H3.211V.4a.4.4,0,0,1,.4-.4H4.951a.4.4,0,0,1,.4.4V2.141H9.634V.4a.4.4,0,0,1,.4-.4h1.338a.4.4,0,0,1,.4.4V2.141h1.606a1.606,1.606,0,0,1,1.606,1.606v1.2A.4.4,0,0,1,14.585,5.352ZM.4,6.423H14.585a.4.4,0,0,1,.4.4v8.7a1.606,1.606,0,0,1-1.606,1.606H1.606A1.606,1.606,0,0,1,0,15.522v-8.7A.4.4,0,0,1,.4,6.423Zm10.571,4.683a.4.4,0,0,0-.4-.4H8.564V8.7a.4.4,0,0,0-.4-.4H6.824a.4.4,0,0,0-.4.4V10.7H4.416a.4.4,0,0,0-.4.4v1.338a.4.4,0,0,0,.4.4H6.423v2.007a.4.4,0,0,0,.4.4H8.162a.4.4,0,0,0,.4-.4V12.845h2.007a.4.4,0,0,0,.4-.4Z" transform="translate(0 0)"></path>
    </svg>
  </mrd-button>
</div>

<div #timeInput *ngIf="time"></div>
<div *ngIf="time && !customDateTimeToggle">  
  <mrd-button icon-button fullIcon diameter="24" iconSize="18" (click)="toggleClicked()" [disabled]="formControl?.disabled || disabled">
    <svg mrd-icon viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12C3 16.9706 7.02944 21 12 21Z" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 6V12" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16.24 16.24L12 12" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </mrd-button>
</div>

<span class="unfocusedOverlay" *ngIf="!isFocused">
  <ng-content select="[unfocusedOverlay]"></ng-content>
</span>

<ng-template
  cdk-connected-overlay
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayOrigin]="dateInputElement"
  [cdkConnectedOverlayOpen]="showDatepicker.value"
  [cdkConnectedOverlayPositions]="_positions"
  (backdropClick)="showDatepicker.value = false;"
  >
  <mrd-datepicker
    [date]="value"
    (dateChanged)="dateChanged($event)"
  ></mrd-datepicker>
</ng-template>

<ng-template
  cdk-connected-overlay
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayOrigin]="timeInputElement"
  [cdkConnectedOverlayOpen]="showTimepicker.value"
  [cdkConnectedOverlayPositions]="_positions"
  (backdropClick)="showTimepicker.value = false;"
  >
  <mrd-timepicker
    [time]="value"
    (timeChanged)="timeChanged($event)"
  ></mrd-timepicker>
</ng-template>
