                </span>
            </mrd-button>
        </div>
    </div>
    <div class="mrd-timepicker-actions">
        <mrd-button flat-button warn (click)="timeChanged.emit(null)">Abbrechen</mrd-button>
        <mrd-button flat-button primary (click)="save()">OK</mrd-button>
    </div>
</div>
