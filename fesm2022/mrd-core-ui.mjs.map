<div class="mrd-select-option-item" [ngClass]="{'selected': selected, 'filtered': filtered, 'focused': focused, 'disabled': disabled}" (click)="optionClick()">
  <span>
    <div *ngIf="multiple && !noCheckbox" class="mrd-select-option-checkbox-wrapper">
      <!-- <span class="mrd-select-option-checkbox" [ngClass]="{'selected': selected}">
        <ng-container *ngIf="selected">
          <svg fill="#ffffff" width="16px" height="16px" viewBox="-4 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg" stroke="#000000" stroke-width="0.00032">
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
            <g id="SVGRepo_iconCarrier"> <title>check</title> <path d="M19.375 5.063l-9.5 13.625-6.563-4.875-3.313 4.594 11.188 8.531 12.813-18.375z"></path></g>
          </svg>

      </span> -->
      <mrd-checkbox [checked]="selected"></mrd-checkbox>
    </div>
    <ng-content select="mrd-icon:not([icon-end]), [mrd-icon]:not([icon-end])"></ng-content>
    <span #optionValue class="mrd-select-option-value-text"><ng-content></ng-content></span>
    <ng-content select="mrd-icon[icon-end], [mrd-icon][icon-end]"></ng-content>
  </span>
</div>
