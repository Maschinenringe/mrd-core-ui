<div class="mrd-label-content" [ngClass]="{'mrd-label-floating': float === 'always' || floating.value, 'mrd-label-hidden': float === 'never' && floating.value, 'mrd-label-top': labelTop}">
  <span class="mrd-label-text"><ng-content></ng-content><ng-container *ngIf="required.value">&nbsp;*</ng-container></span>
</div>
