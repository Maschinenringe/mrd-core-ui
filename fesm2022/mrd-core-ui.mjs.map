<div class="mrd-form-field-container"
  [ngClass]="{'mrd-form-field-container-fill': fill, 'mrd-form-field-container-outline': outline}"
  [style.--focus-color]="focusColor"
  [style.--error-color]="errorColor"
  [style.--focus-color-dark]="focusColorDark"
  [style.--error-color-dark]="errorColorDark"
  [style.--focus-color-outline]="focusColorOutline"
  [style.--error-color-outline]="errorColorOutline"
  [style.--ff-border-radius]="borderRadius"
  [style.--ff-fill-color]="fillColor"
>
  <div class="mrd-form-field-content-container"
    [ngClass]="{'mrd-form-field-error': hasError, 'mrd-form-field-disabled': disabled, 'mrd-form-field-focused': focused,
      'mrd-form-field-content-container-outline': outline, 'mrd-form-field-content-container-fill': fill, 'mrd-form-field-dark-theme': dark}">
    <ng-content select="mrd-prefix"></ng-content>
    <div class="mrd-form-field-input-content-container">

      <ng-content select="mrd-input"></ng-content>
      <ng-content select="mrd-select"></ng-content>
      <ng-content select="mrd-label"></ng-content>
      <ng-content select="mrd-date-range-picker"></ng-content>

    </div>
    <ng-content select="mrd-suffix"></ng-content>
  </div>
  <div class="mrd-form-field-subcontent-container">
    <ng-content select="mrd-hint"></ng-content>
    <ng-content select="mrd-error"></ng-content>
  </div>
</div>
