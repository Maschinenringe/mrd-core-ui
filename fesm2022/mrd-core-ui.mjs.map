<div class="mrd-date-range-picker-container">
    <ng-content select="mrd-input"></ng-content>
    <div #dateInput></div>
    <mrd-button icon-button fullIcon diameter="24" iconSize="16" (click)="showDatepicker.value = !showDatepicker.value"><mrd-icon svgIcon="mrd_calendar"></mrd-icon></mrd-button>
</div>

<ng-template
  cdk-connected-overlay
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayOrigin]="dateInputElement"
  [cdkConnectedOverlayOpen]="showDatepicker.value"
  [cdkConnectedOverlayPositions]="_positions"
  (backdropClick)="showDatepicker.value = false"
>
  <mrd-datepicker
    range-picker
    [startDate]="startValue"
    [endDate]="endValue"
    (dateRangeChanged)="rangeChanged($event)"
  ></mrd-datepicker>
</ng-template>
