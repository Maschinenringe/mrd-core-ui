<div class="mrd-datepicker-container">
    <div class="mrd-datepicker-header">
        <mrd-button (click)="changeView()">{{months[monthIndex]}} {{year}}</mrd-button>
        <div class="mrd-datepicker-header-navigation">
            <mrd-button icon-button (click)="previous()"><</mrd-button>
            <mrd-button icon-button (click)="next()">></mrd-button>
        </div>
    </div>
    <div class="mrd-datepicker-content">
        <ng-container *ngIf="showDays">
            <div class="mrd-datepicker-weekdays">
                <div class="mrd-datepicker-weekday">Mo</div>
                <div class="mrd-datepicker-weekday">Di</div>
                <div class="mrd-datepicker-weekday">Mi</div>
                <div class="mrd-datepicker-weekday">Do</div>
                <div class="mrd-datepicker-weekday">Fr</div>
                <div class="mrd-datepicker-weekday">Sa</div>
                <div class="mrd-datepicker-weekday">So</div>
            </div>
            <div class="mrd-datepicker-weekdays wrap">
                <div class="mrd-datepicker-weekday" *ngFor="let p of placeholder"></div>
                <ng-container *ngIf="!range">
                    <mrd-button icon-button fullIcon diameter="2em" [class]="{'today': d.isToday && !d.isSelected.value, 'selected': d.isSelected.value}"
                        class="mrd-datepicker-weekday" *ngFor="let d of days" (click)="dateSelected(d)">
                        {{d.day}}
                    </mrd-button>
                </ng-container>
                <ng-container *ngIf="range">
                    <mrd-button icon-button fullIcon diameter="2em" 
                    [class.today]="d.isToday && !d.isSelected.value" 
                    [class.selected]="d.isSelected.value" 
                    [class.rangeSelected]="d.rangeSelected.value"
                    [class.betweenRange]="d.betweenRange.value"
                    [class.rangeHover]="d.rangeHover.value"
                    [class.rangeHoverBetween]="d.rangeHoverBetween.value"
                        class="mrd-datepicker-weekday" *ngFor="let d of days; trackBy: trackById" (click)="dateSelected(d)"
                        [mrdDateRangeIndicator]="d" [startDate]="startDate" [endDate]="endDate" [hoverEndDate]="endHoverDate" (isHovering)="endHoverDate = $event">
                        {{d.day}}
                    </mrd-button>
                </ng-container>
            </div>
        </ng-container>
        <ng-container *ngIf="showYears">
            <div class="mrd-datepicker-years">
                <mrd-button outline-button diameter="2em" [class]="{'selected': y === year}" *ngFor="let y of yearRange;"
                    (click)="yearSelected(y)">
                    {{y}}
                </mrd-button>
            </div>
        </ng-container>
        <ng-container *ngIf="showMonths">
            <div class="mrd-datepicker-months">
                <mrd-button outline-button diameter="2em" [class]="{'selected': i === monthIndex}" *ngFor="let m of fullMonths; let i = index"
                    (click)="monthSelected(i)">
                    {{m}}
                </mrd-button>
            </div>
        </ng-container>
    </div>
</div>
