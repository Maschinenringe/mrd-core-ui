<div class="mrd-checkbox-container" [ngClass]="{'mrd-checkbox-disabled': formControl?.disabled || disabled}" (click)="toggle()"
  [mrdToolTip]="tooltipText" [showToolTip]="tooltip && !tooltipDisabled" [position]="tooltipPosition" [showOnTruncatedElement]="tooltipIfTruncated ? checkboxlabel : undefined"
  [style.--box-height]="checkboxHeight"
  [style.--box-width]="checkboxWidth"
  [style.--bg-color]="bgColor"
  [style.--bg-color-hover]="bgColorHover"
  [style.--bg-color-checked]="bgColorChecked"
  [style.--bg-color-checked-hover]="bgColorCheckedHover"
  [style.--color]="color"
  [style.--color-hover]="colorHover"
  [style.--color-checked]="colorChecked"
  [style.--color-checked-hover]="colorCheckedHover"
  [style.--border]="border"
  [style.--border-hover]="borderHover"
  [style.--border-checked]="borderChecked"
  [style.--border-checked-hover]="borderCheckedHover"
  [class.rounded]="rounded"
  [class.checked]="checked"
  >
  <span class="mrd-checkbox-box" *ngIf="!customIcons">
    <ng-container *ngIf="checked">
      <svg fill="#ffffff" width="16px" height="16px" viewBox="-4 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg" stroke="#000000" stroke-width="0.00032">
        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
        <g id="SVGRepo_iconCarrier"> <title>check</title> <path d="M19.375 5.063l-9.5 13.625-6.563-4.875-3.313 4.594 11.188 8.531 12.813-18.375z"></path></g>
      </svg>
    </ng-container>
  </span>
  <div class="mrd-checkbox-custom" [ngClass]="{'isHover': !customHoverIcons}" *ngIf="customIcons">
    <ng-content *ngIf="checked" select="[icon-checked]"></ng-content>
    <ng-content *ngIf="!checked" select="[icon-unchecked]"></ng-content>
  </div>
  <div class="mrd-checkbox-custom-hover" *ngIf="customHoverIcons">
    <ng-content *ngIf="checked" select="[icon-checked-hover]"></ng-content>
    <ng-content *ngIf="!checked" select="[icon-unchecked-hover]"></ng-content>
  </div>
  
  
  <span #checkboxlabel class="mrd-checkbox-label"
    [class.singleLine]="singleLine"
    [class.ellipsis]="ellipsis"
    ><ng-content></ng-content></span>
  </div>
