<div class="mrd-stepper-steps-container" [ngStyle]="{'height': headerHeight+'px'}">
  <div class="mrd-stepper-step-container" [ngClass]="{'last-step': i === steps.length - 1}" *ngFor="let step of steps; let i = index;">
    <div class="mrd-stepper-step" #mrdStepHeader 
      [ngClass]="{'step-active': step.active, 'step-invalid': step.touched && step.mrdStepControl && !step.mrdStepControl.valid,
        'topLabel': labelposition === 'top', 'bottomLabel': labelposition === 'bottom', 'leftLabel': labelposition === 'left', 'rightLabel': labelposition === 'right'}" 
      (click)="activateStep(step.index)">
      <div class="mrd-stepper-step-icon">
        <span>{{step.index + 1}}</span>
      </div>
      <div class="mrd-stepper-step-label">
        {{step.label}}
      </div>
    </div>
    <div class="mrd-stepper-step-separator" [ngClass]="{'next-step-active': activeIndex > i}" *ngIf="i < steps.length - 1"></div>
  </div>
</div>
<div class="mrd-stepper-content-container">
  <!-- <ng-content></ng-content> -->
  <ng-container *ngFor="let tab of steps">
    <mrd-tab-body
      [content]="tab.content"
      [active]="tab.active"
      [index]="tab.index"
      [preserveContent]="tab.preserveContent"
      >
    </mrd-tab-body>
  </ng-container>
</div>
